services:
  db:
    image: mariadb:11.4
    ports: ["127.0.0.1:${DB_PORT:-3307}:3306"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-geuncha}
      MARIADB_USER: ${DB_USER:-geuncha}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      TZ: UTC
    volumes: ["mariadb_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mariadb_data:
